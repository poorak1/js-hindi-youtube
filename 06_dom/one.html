<!--  
A node list is returned using queryselectorall. Each item in a node list can be accessed using a [] operator. A foreach loop can also be 
applied to the nodelist.
example: 
const templilist = document.querySelectorAll("li")
templilist.forEach((li_item) => {li_item.style.color = 'green'})
-->

<!--
A HTML collection is also returned sometimes. each item in the html collection can be accessed using [] operator. Altough a foreach loop 
cannot be applied to html collection. You may convert it to array first to apply relevant loops.
-->

<!--
To convert a HTMl collection/ node list to array. you may use the following:
Array.from(list name)
-->
